<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensors - AeroTrace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="brand-logo">
                    <i class="bi bi-wind"></i> AeroTrace
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="../index.html" class="nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="events.html" class="nav-item"><i class="bi bi-activity"></i> Events</a>
                <a href="event-investigation.html" class="nav-item"><i class="bi bi-search"></i> Investigation</a>
                <a href="facilities.html" class="nav-item"><i class="bi bi-buildings"></i> Facilities</a>
                <a href="sensors.html" class="nav-item active"><i class="bi bi-broadcast"></i> Sensors</a>
                <a href="reports.html" class="nav-item"><i class="bi bi-file-earmark-text"></i> Reports</a>
                <a href="settings.html" class="nav-item"><i class="bi bi-gear"></i> Settings</a>
            </nav>
        </aside>

        <main class="app-main">
            <header class="app-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
                    <h1 class="header-title">Sensor Network</h1>
                </div>
            </header>

            <div class="app-content" id="mainContent">
                <div class="page-subtitle">Manage pollution monitoring stations and arrays.</div>
                
                <section class="data-section">
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Location</th>
                                    <th>Pollutant(s)</th>
                                    <th>Status</th>
                                    <th>Last Seen</th>
                                </tr>
                            </thead>
                            <tbody id="sensorsTableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/dev-adapter.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('sensorsTableBody');
            try {
                const data = await window.API.getSensors();
                if(data && data.length) {
                    data.forEach(sen => {
                        const statusClass = sen.status === 'Online' ? 'success' : (sen.status === 'Offline' ? 'danger' : 'warning');
                        tbody.innerHTML += `
                            <tr>
                                <td>${sen.id}</td>
                                <td><strong>${sen.name}</strong></td>
                                <td>${sen.location || '-'}</td>
                                <td>${sen.pollutant || '-'}</td>
                                <td><span class="status-badge ${statusClass}">${sen.status}</span></td>
                                <td>${sen.lastSeen ? new Date(sen.lastSeen).toLocaleString() : '-'}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No sensors found.</td></tr>';
                }
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load sensors.</td></tr>';
                if (window.updateConnectionStatus) window.updateConnectionStatus(true);
            }
        });
    </script>
</body>
</html>
